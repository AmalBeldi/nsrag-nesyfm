[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nsrag"
version = "0.1.0"
description = "Reference implementation of the NS-RAG experimental pipeline (graph-grounded three-state verification for clinical QA)"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
where = ["src"]
